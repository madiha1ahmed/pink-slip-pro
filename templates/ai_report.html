{% extends 'base.html' %}
{% block title %}AI Evaluation Report{% endblock %}

{% block content %}
<div class="container">
  <h2 class="text-center text-info my-4">AI Report – {{ month }} {{ year }}</h2>
  <div class="card p-4">
    <div class="report-content">
      {{ report|safe }}
    </div>
  </div>
  
    
    
    
  </div>
  <div class="text-center mt-3">
    <a href="{{ url_for('download_report', month=month, year=year) }}" class="btn btn-primary">Download PDF</a>
  </div>
  
</div>
{% endblock %}
